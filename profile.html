<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="stylesheet" href="/src/site.css">
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self';
      style-src 'self' 'unsafe-inline';
      img-src 'self' https: data:;
      font-src 'self';
      connect-src 'self' https://tiles.salishsea.io https://o4509634382331904.ingest.us.sentry.io;
      object-src 'none';
      media-src 'self';
      worker-src 'self';
      base-uri 'self';
      form-action 'none';
      upgrade-insecure-requests;
    ">
    <title>Profile — SalishSea.io</title>
    <meta name="description" content="A profile on SalishSea.io.">
    <meta property="og:site_name" content="SalishSea.io">
    <meta property="og:type" content="profile">
    <meta property="og:title" content="Profile — SalishSea.io">
    <meta property="og:description" content="A profile on SalishSea.io.">
    <meta property="og:image" content="https://salishsea.io/social-card.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <!-- Root-absolute URLs: a profile is served at /<kind>/<identifier>/<slug>, so
         relative paths would resolve under /<kind>/. -->
    <link href="/favicon.svg" rel="icon" type="image/svg+xml">
    <link href="/favicon.ico" rel="icon" sizes="48x48">
    <link href="/apple-touch-icon.png" rel="apple-touch-icon">
    <style>
      :root {
        font-synthesis: style;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      body {
        margin: 0;
      }
    </style>
    <!-- A template, not a page: the read-path build renders every profile into it, an
         individual's, a matriline's, a population's, a pod's or a haul-out site's
         (scripts/read-path/profile-document.ts). It replaces the title, description and
         link-preview tags, adds the page's islands here, and puts the page's own element
         in place of <profile-page>. Nothing serves the template itself (fly/Caddyfile). -->
  </head>
  <body>
    <profile-page></profile-page>
  </body>
</html>
