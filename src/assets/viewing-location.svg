<!--
  Infrastructure marker; see hydrophone-default.svg for why the plate is square.

  The eye was also drawn in #3399CC — the same blue as an unvisited occurrence
  marker's ring — so it collided with the occurrences twice over. It joins the
  other two in #1e2b76.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 255 255" width="16" height="16">
    <defs>
        <style>
            .background {
                fill: #fff
            }

            .line {
                fill: none;
                stroke: #1e2b76;
            }

            .cls-1 {
                stroke-miterlimit: 10;
                stroke-width: 15px;
            }

            .cls-2 {
                stroke-linejoin: round;
                stroke-width: 13px;
            }

            .dot {
                fill: #1e2b76
            }
        </style>
    </defs>
    <g id="Layer_1" data-name="Layer 1">
        <rect class="background" x="7.5" y="7.5" width="240" height="240" rx="40" />
        <rect class="line cls-1" x="7.5" y="7.5" width="240" height="240" rx="40" />
        <path class="line cls-2" d="M48,127.5 Q127.5,58 207,127.5 Q127.5,197 48,127.5 Z" />
        <circle class="dot" cx="127.5" cy="127.5" r="30" />
    </g>
</svg>
