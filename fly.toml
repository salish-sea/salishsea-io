# The salishsea-io Fly app (decision 056, salish-t3g.3). Deploy with fly/deploy.sh.
app = "salishsea-io"
# Fly has no Seattle region any more; San Jose is the nearest, and offers Fly's
# managed Postgres for when the database moves (decision 056, step 4).
primary_region = "sjc"

[build]
  dockerfile = "fly/Dockerfile"

# What users write lives in the write API's store on the volume (decision 065, cut over
# 2026-10-05): the API runs, under Litestream, and the build reads the store, not
# Postgres (docs/runbook/read-path-build.md, "The write API").
[env]
  API_ENABLED = "1"
  READ_PATH_STORE = "/data/store/salishsea.db"

# One machine, always running: it holds the volume and the hourly schedule, so it
# cannot stop when idle, and there is no second machine to share the volume with.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

# Build state, the snapshot and the served files. Stelis's history on it is the
# only thing here that can't be rebuilt, and it is a record, not data.
[mounts]
  source = "salishsea_data"
  destination = "/data"

# CPU is what runs out first here, not memory (bd salish-xv35.5). A shared vCPU's
# sustained share is 5 ms in every 80 (6.25% of a core), plus banked burst credit that
# every machine start resets; four shared vCPUs combine to 20 ms in 80, about six
# CPU-hours a day, against a measured ~1.6-2.4 for today's ~95 builds a day
# (https://docs.fly.io/machines/cpu-performance). Builds are single-threaded (DuckDB is
# pinned to one thread), so the extra vCPUs buy quota, not parallelism, and memory stays
# at 1 GB. Chosen on 2026-10-02 as relief while the build's own CPU is cut.
[[vm]]
  size = "shared-cpu-4x"
  memory = "1gb"
