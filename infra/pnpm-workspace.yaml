# `infra/` is its own pnpm project, not a member of the root workspace: it has a
# different TypeScript major, a CDK-only dependency graph, and is built by a
# separate deploy step. pnpm resolves the workspace root by walking up until it
# finds a pnpm-workspace.yaml, so without this file the root one claims `infra`
# and `pnpm install` here reports "Already up to date" having installed nothing.
# That fails silently — the CDK deploy would only discover it at `cdk deploy`.
# See docs/decisions/025.
#
# THIS FILE MUST CONTAIN AT LEAST ONE KEY. A comments-only YAML document parses to
# `null`, not an empty mapping, and Dependabot's npm_and_yarn file fetcher does
# `parsed_pnpm_workspace_yaml["packages"]` unguarded — so a comments-only file
# crashes it with `NoMethodError: undefined method '[]' for nil` before it fetches
# anything. Every `/infra` update job failed that way on 2026-08-04 until this key
# was added, while the root project (whose file has real keys) updated fine. pnpm
# is happy either way, so no local check catches it.
#
# `allowBuilds` rather than `packages: []` because the root file has exactly this
# shape — a mapping with no `packages` key — and its update jobs are known to
# succeed. Nothing here is permitted to run an install script. Every package
# that ships one must still be listed, as false: pnpm exits 1 with
# ERR_PNPM_IGNORED_BUILDS on any it hasn't been told about, which fails
# `pnpm install --frozen-lockfile` in every workflow. Add entries here, not to
# the root file.
allowBuilds:
  # Both came with jest 30, and each script is only a fallback: the package
  # ships a prebuilt binary per platform as an optional dependency, and the
  # script compiles one from source (@parcel/watcher) or fetches one
  # (unrs-resolver's napi-postinstall) only when none matched.
  '@parcel/watcher': false
  unrs-resolver: false

# Force patched versions of jest-toolchain transitives (all dev-scope, only
# reachable through jest here). Dependabot can't open security updates for
# these, and `pnpm update <name>` leaves them where they are, so an override is
# the way to move them. Drop each once the toolchain's own ranges resolve past it.
#   js-yaml 3.x < 3.15.2: CPU denial of service (alerts 148, 149, 150, 180)
#   @babel/core <= 7.29.0: arbitrary file read via sourceMappingURL (alert 155)
#   browserslist <= 4.28.6: crash or prototype write on untrusted queries (alert 165)
#   baseline-browser-mapping < 2.11.0: process exit on invalid input (alert 179)
overrides:
  'js-yaml@<3.15.2': '>=3.15.2 <4'
  '@babel/core@<=7.29.0': '>=7.29.6 <8'
  'browserslist@<4.28.7': '>=4.28.7 <5'
  'baseline-browser-mapping@<2.11.0': '>=2.11.0 <3'
