<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Fontconfig for the card renderer's Lambda.

  The Lambda runtime image ships no fonts at all. sharp rasterizes the card's
  SVG overlay through librsvg, which asks fontconfig for a face; with nothing to
  find, every glyph renders as a .notdef box. That failure is invisible to any
  check short of looking at the image — the response is still a valid JPEG of
  plausible size — and it is exactly what reached production on 2026-07-27.

  This file makes the bundled fonts the only ones fontconfig knows about, so the
  Lambda renders the same glyphs a developer sees locally instead of whatever
  the host happens to have. `dir` is relative to this file's directory.
-->
<fontconfig>
  <dir prefix="default">.</dir>

  <!-- Anything the card asks for resolves to the one family we ship. -->
  <alias>
    <family>sans-serif</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <alias>
    <family>Helvetica</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <alias>
    <family>Arial</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>

  <!-- Lambda's filesystem is read-only apart from /tmp. -->
  <cachedir>/tmp/fontconfig</cachedir>
</fontconfig>
