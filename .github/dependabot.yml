# Automatically opens PRs for dependency updates.
# Can be turned on and off for org or repository via "Code security and analysis" tab .
# See https://docs.github.com/en/code-security/dependabot/dependabot-alerts/configuring-dependabot-alerts
version: 2
updates:
  # Updates GHA dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "05:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 3

  # Updates JavaScript dependencies. `npm` is also Dependabot's name for the pnpm
  # and yarn ecosystems; what it needs from us is a lockfile format it groks, and
  # pnpm 11 writes lockfileVersion 9 (see the top of pnpm-lock.yaml), which it
  # supports. Its handling of the pnpm 11 *CLI* is newer ground, so if updates go
  # quiet after the pnpm migration (decision 025), check Insights → Dependency
  # graph → Dependabot for a failing run rather than assuming there is nothing to
  # update. Covers the root only — infra/ has its own lockfile, untracked here.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "05:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 10
    open-pull-requests-limit: 3
    groups:
      all:
        patterns:
          - "*"
