# Dependabot opens pull requests for security updates only. Every entry below
# sets `open-pull-requests-limit: 0`, which turns off the scheduled version
# updates; security updates have their own fixed limit of 10 and are switched on in the
# repository's "Code security" settings. The entries stay so that security
# updates still find infra/ and use the settings here. To bring version updates
# back, raise the limits.
# See https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # Updates GHA dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "05:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 0

  # Updates JavaScript dependencies. `npm` is also Dependabot's name for the pnpm
  # and yarn ecosystems; what it needs from us is a lockfile format it groks, and
  # pnpm 11 writes lockfileVersion 9 (see the top of pnpm-lock.yaml), which it
  # supports. Its handling of the pnpm 11 *CLI* is newer ground, so if updates go
  # quiet after the pnpm migration (decision 025), check Insights → Dependency
  # graph → Dependabot for a failing run rather than assuming there is nothing to
  # update.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: "05:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 10
    open-pull-requests-limit: 0
    groups:
      all:
        patterns:
          - "*"

  # `infra/` is a separate pnpm project (decision 025), and Dependabot resolves one
  # manifest per entry — a `directory: /` entry does not reach it. Until this was
  # added it never did, which is why seven of the repository's nine open Dependabot
  # alerts were against infra/package-lock.json while the root got monthly updates.
  #
  # A second entry rather than `directories: ["/", "/infra"]` so the two projects
  # could have independent PR limits, back when version updates were on.
  #
  # Keep infra/pnpm-workspace.yaml non-empty. Dependabot indexes that file without
  # a nil guard, and a comments-only YAML document parses to `null`, so stripping
  # it back to comments crashes every job under this entry before it fetches
  # anything (`NoMethodError: undefined method '[]' for nil`). pnpm does not care,
  # so nothing local catches it — the symptom is only ever a red Dependabot run.
  - package-ecosystem: npm
    directory: /infra
    schedule:
      interval: monthly
      time: "05:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 10
    open-pull-requests-limit: 0
    ignore:
      # TypeScript 7 no longer includes the JavaScript compiler API, which ts-jest
      # (the tests) and ts-node (cdk.json's app) both need (#711). Lift this once
      # neither is in use.
      - dependency-name: typescript
        versions: [">=7"]
      # The type definitions follow the Lambda runtime, NODEJS_24_X in
      # lib/infra-stack.ts. Move this bound when the runtime moves.
      - dependency-name: "@types/node"
        versions: [">=25"]
    groups:
      all:
        patterns:
          - "*"
