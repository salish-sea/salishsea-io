name: Deploy
on:
  push:
    branches:
      - main
  # A fresh run of the tip, which is what the watch job dispatches when GitHub loses one
  # of this run's deployments. Also the way to redeploy main by hand: unlike a re-run, it
  # checks out the current tip (gotcha 3 in the runbook).
  workflow_dispatch:
# Serialize production deploys. Several PRs merging in quick succession otherwise
# run overlapping `cdk deploy`s against the same CloudFormation stacks, which fails
# with "stack ... in UPDATE_COMPLETE_CLEANUP_IN_PROGRESS". Queue instead of cancel:
# never interrupt an in-flight deploy mid `cdk deploy`. The price
# is that a run which never finishes holds every later one; the watch job is what
# keeps that from lasting.
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  # The gate. Nothing here is production-specific — it is the same suite PRs run
  # (see build.yml), pointed at the commit actually being deployed. PR checks are
  # not enough on their own: they run against the PR head rather than the merge
  # result, and no ruleset requires them, so a push landing on `main` by any other
  # route would otherwise reach production untested.
  #
  # It costs a minute or so on the front of every deploy, against shipping a change
  # nothing tested.
  test:
    name: Test
    uses: ./.github/workflows/build.yml

  # The Fly image, built and pushed beside the tests (salish-t3g.10). Pushing an image
  # to Fly's registry changes nothing in production, and the remote build takes minutes
  # the rest of the run no longer waits for. The deploy job waits for it, so an image
  # that won't build stops the run before anything changes; and building with
  # the token proves FLY_API_TOKEN works before anything changes. It also uploads the
  # bundle's source maps to Sentry from the build that ships (fly/deploy.sh). Not
  # checked against the tip: building an older commit's image is harmless, and the
  # switch below is what could ship one.
  image:
    name: Build the Fly image
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # flyctl pinned like everything else here, in both jobs that install it. Its own
      # releases (github.com/superfly/flyctl) are what to track, not the action's. It
      # installs no `fly` alias, so scripts call `flyctl`.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        with:
          version: 0.4.112
      - name: Build and push
        run: fly/deploy.sh build
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  deploy:
    name: Deploy
    needs: [test, image]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    # Read by the alert job to decide whether silence is safe. Set by a step, so
    # it survives this job failing: everything after that step can leave
    # production changed.
    outputs:
      mutation_started: ${{ steps.mutation.outputs.started }}
    steps:
      # A workflow re-run always checks out its ORIGINAL commit. Re-running an
      # older, failed deploy therefore rebuilds and ships a superseded tree —
      # a silent production rollback. That happened on 2026-07-27: a transient
      # credentials failure was re-run after a newer commit had already
      # deployed, and it reverted the newer one (bd salish-i74).
      #
      # Deploys are also serialized (see the concurrency block), so a queued run
      # can be overtaken by a later merge before it ever starts.
      #
      # Either way the commit in hand is no longer what main says to ship, so
      # refuse rather than deploy backwards. Loud on purpose: this should be rare,
      # and a green "nothing happened" is how the rollback went unnoticed the
      # first time. If a newer deploy is green, this failure is safe to ignore.
      #
      # Checked twice: once here (cheap, catches the stale re-run immediately) and
      # again immediately before the first remote mutation, so a merge landing
      # mid-run has seconds rather than minutes to slip past. Neither is a lock —
      # see the runbook for what this does and doesn't cover.
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refuse to deploy a superseded commit
        uses: ./.github/actions/require-current-tip
        with:
          token: ${{ github.token }}
          phase: before setup
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::648183724555:role/salishsea-deploy-action
          aws-region: us-west-2
      # The CDK step runs last, so a synth refusing a missing secret there would fail
      # with production already half-changed. Refuse here instead, while nothing is.
      # The value must equal the Fly app's EDGE_SECRET (decision 065; infra-stack.ts's
      # edgeSecretFromContext says what goes wrong otherwise).
      - name: Require the edge secret
        env:
          EDGE_SECRET: ${{ secrets.EDGE_SECRET }}
        run: |
          if [ "${#EDGE_SECRET}" -lt 32 ]; then
            echo "::error::The production environment's EDGE_SECRET is missing or shorter than 32 characters."
            exit 1
          fi
      # Last check before anything leaves this runner: everything above is local
      # setup, everything below mutates production.
      - name: Re-check the tip before mutating anything
        uses: ./.github/actions/require-current-tip
        with:
          token: ${{ github.token }}
          phase: before the first remote change
      # The point of no return. Every step below can leave production changed,
      # which is what decides whether a failure is safe to stay quiet about.
      - name: Mark the start of production mutation
        id: mutation
        run: echo "started=true" >> "${GITHUB_OUTPUT}"
      - name: Setup pnpm for CDK
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node for CDK
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      # `infra/` is its own pnpm project (own lockfile, own pnpm-workspace.yaml),
      # so this installs from infra/pnpm-lock.yaml, not the root one.
      - name: Deploy CDK infra (CloudFront + Lambda@Edge)
        working-directory: infra
        env:
          EDGE_SECRET: ${{ secrets.EDGE_SECRET }}
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm exec cdk deploy --all --require-approval never \
            --context "edgeSecret=${EDGE_SECRET}"

  # The Fly app: the site people see, the read-path build and the write API (decisions
  # 061, 065; salish-t3g.5). The switch to the image the image job pushed, after the
  # deploy job, so the CDK stacks are in place before the code that relies on them ships. It is the
  # script a hand deploy runs: the machine's build lock is taken so the switch doesn't
  # kill a running build, then the image is deployed (decision 066).
  fly:
    name: Switch the Fly app
    needs: [deploy, image]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only on a re-run, which checks out its original commit and could ship it over a
      # newer one. A first attempt can't be overtaken here: the concurrency group holds
      # the next run until this one ends, so a merge landing while the deploy job ran
      # is deployed by the run queued behind this one. Checking anyway would fail this
      # job and file a deploy-failed issue for every pair of close merges.
      - name: Refuse to deploy a superseded commit
        if: ${{ github.run_attempt != 1 }}
        uses: ./.github/actions/require-current-tip
        with:
          token: ${{ github.token }}
          phase: before the Fly deploy
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        with:
          version: 0.4.112
      - name: Switch
        run: fly/deploy.sh switch
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # Post-deploy verification, inside the deploy run rather than trailing it: a
  # deploy whose steps all reported success but left production not answering
  # correctly still ends red, and — because it is *this* run that fails — the
  # alert below sees it. The specs are the deployed commit's own, so this asks
  # "does what we just shipped work?", not "is production current?"; the latter is
  # what the scheduled smoke run and the require-current-tip guard are for.
  smoke:
    name: Smoke
    needs: [deploy, fly]
    # Whenever the deploy job changed production, even if the Fly job then failed: the
    # previous image behind newly deployed infrastructure is exactly what smoke should look at.
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    uses: ./.github/workflows/smoke.yml

  # GitHub sometimes loses a job's deployment to the production environment. The job sits
  # "waiting" for approval that nobody can give: the environment has no reviewers, and the
  # API lists none (twice on 2026-10-06, about three hours each; salish-t3g.11). Since
  # deploys queue rather than cancel, every later run waits behind it, so main stops
  # deploying and nothing says so. timeout-minutes can't catch it, because it counts from
  # when a runner takes the job and a lost job never gets one. cancel-in-progress would
  # catch it, but it would also interrupt a healthy deploy mid `cdk deploy`.
  #
  # So this job watches the run's own environment-bound jobs. When one has waited
  # STALL_MINUTES without a runner, it waits for whatever else is running to finish, so the
  # cancel interrupts nothing. Then it files the deploy-failed issue, dispatches one fresh
  # run if this run holds the tip, and cancels this run so the queue moves. It binds no
  # environment itself, so it can't be lost the same way.
  watch:
    name: Watch for a lost deployment
    needs: [test, image]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write  # dispatch the retry, cancel this run
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # A healthy job gets a runner within seconds: the environment has no reviewers or
      # wait timer.
      STALL_MINUTES: '15'
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Watch the environment-bound jobs
        run: |
          # The jobs that bind the production environment, named as the jobs API reports
          # them. Keep in step with the jobs above.
          env_jobs='["Deploy", "Switch the Fly app"]'
          # filter=latest: each job's newest attempt, so a partial re-run still lists the
          # jobs it didn't repeat.
          jobs_path="repos/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}/jobs?filter=latest"
          while :; do
            jobs=$(gh api --paginate "${jobs_path}" --jq '.jobs[]' | jq -s .)
            # Done once every environment-bound job exists and has a runner or has
            # finished. Fly only appears once Deploy ends, skipped if it
            # failed, so their absence means the run isn't past the risk yet.
            done=$(jq --argjson names "${env_jobs}" '
              [.[] | select(.name | IN($names[]))] as $e
              | ($e | length) == ($names | length)
                and ($e | all(.status == "completed" or (.runner_name // "") != ""))' <<<"${jobs}")
            if [ "${done}" = "true" ]; then
              echo "Every environment-bound job got a runner."
              exit 0
            fi
            stalled=$(jq --argjson names "${env_jobs}" --argjson limit "$((STALL_MINUTES * 60))" '
              [.[] | select(.name | IN($names[]))
                   | select(.status != "completed" and (.runner_name // "") == "")
                   | select(now - (.created_at | fromdateiso8601) > $limit)]' <<<"${jobs}")
            busy=$(jq --arg me "Watch for a lost deployment" '
              [.[] | select(.name != $me and .status != "completed" and (.runner_name // "") != "")]
              | length' <<<"${jobs}")
            if [ "$(jq length <<<"${stalled}")" -gt 0 ] && [ "${busy}" -eq 0 ]; then
              break
            fi
            sleep 30
          done

          names=$(jq -r 'map(.name) | join(", ")' <<<"${stalled}")
          deploy_lost=$(jq 'any(.name == "Deploy")' <<<"${stalled}")
          echo "::error::Lost deployment: ${names} waited over ${STALL_MINUTES} minutes for the production environment without a runner."

          head_sha=$(gh api "repos/${GH_REPO}/commits/${GITHUB_REF_NAME}" --jq .sha)
          # One automatic retry, and only of the tip: a superseded commit has a newer run
          # queued behind this one, which the cancel below lets start.
          retry=false
          if [ "${head_sha}" = "${GITHUB_SHA}" ] && [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            retry=true
          fi

          # The alert job's rule: a superseded run that changed nothing stays quiet,
          # because the run behind it deploys the tip. A lost Deploy job changed nothing.
          if [ "${head_sha}" = "${GITHUB_SHA}" ] || [ "${deploy_lost}" != "true" ]; then
            mkdir -p dist
            {
              echo "Deploy of \`${GITHUB_SHA}\` stalled: GitHub lost the production deployment of ${names}. It waited over ${STALL_MINUTES} minutes for approval the environment doesn't require, so the run was cancelled to let later deploys through."
              echo
              echo "Run: ${RUN_URL}"
              echo
              if [ "${deploy_lost}" = "true" ]; then
                echo "**Production was not touched.** The Deploy job never started, so nothing was deployed or switched."
              else
                echo "**Production is partly updated.** The Deploy job ran, so the CDK stacks are deployed; ${names} never ran. Until a deploy completes, the Fly app may be serving the previous image."
              fi
              echo
              if [ "${retry}" = "true" ]; then
                echo "A fresh Deploy of \`${GITHUB_REF_NAME}\` was dispatched. If it goes green it closes this issue."
              elif [ "${head_sha}" = "${GITHUB_SHA}" ]; then
                echo "This run was already a dispatched retry, so it did not dispatch another. Redeploy by hand once GitHub is healthy: \`gh workflow run deploy.yml --ref ${GITHUB_REF_NAME}\`."
              else
                echo "\`${GITHUB_REF_NAME}\` has moved on to \`${head_sha}\`, whose queued Deploy runs next."
              fi
              echo
              echo "Runbook: [docs/runbook/deploys.md](${GITHUB_SERVER_URL}/${GH_REPO}/blob/main/docs/runbook/deploys.md)"
            } > dist/deploy-stalled.md
            # gh issue list never returns pull requests, unlike the REST listing the
            # alert job filters.
            issue=$(gh issue list --label deploy-failed --state open --json number --jq '.[0].number // empty')
            title="Deploy to production stalled (run ${GITHUB_RUN_ID})"
            if [ -n "${issue}" ]; then
              gh issue edit "${issue}" --title "${title}" --body-file dist/deploy-stalled.md
            else
              gh issue create --title "${title}" --body-file dist/deploy-stalled.md --label deploy-failed
            fi
          fi

          if [ "${retry}" = "true" ]; then
            gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
          fi
          # Cancels this job too, so nothing after it runs unless the cancel didn't take.
          gh run cancel "${GITHUB_RUN_ID}"
          sleep 300
          echo "::error::The run did not cancel. Cancel it by hand: gh run cancel ${GITHUB_RUN_ID}"
          exit 1

  # A red run in the Actions tab is only a signal if someone is looking at the
  # Actions tab. File an issue instead, reusing dwca-nightly.yml's approach: one
  # open issue per failure mode, updated rather than duplicated, closed again by
  # the next green deploy.
  alert:
    name: Alert on failure
    needs: [test, image, deploy, fly, smoke, watch]
    # `!cancelled()` is what lets this run at all — a job whose `needs` were
    # skipped is otherwise skipped itself, which is precisely the case when an
    # early job failed and took the rest of the graph with it.
    if: ${{ !cancelled() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # Two deploys merging in quick succession make the older one fail the
      # superseded-commit guard by design (gotcha 3 in the runbook). That failure
      # is expected and self-correcting — the newer run deploys right behind it —
      # so filing an issue for it would train everyone to ignore these issues.
      #
      # But only while the run changed nothing. Once the deploy job is past its
      # point of no return, a failure has left production in some half-updated
      # state that no newer run is guaranteed to fix, and "someone else will
      # deal with it" is exactly the assumption that loses an outage. Being
      # superseded buys silence only for runs that never touched anything.
      - name: Decide whether silence is safe
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          MUTATION_STARTED: ${{ needs.deploy.outputs.mutation_started }}
        run: |
          head_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" --jq .sha)
          if [ "${head_sha}" = "${GITHUB_SHA}" ]; then
            superseded=false
            alert=true
          elif [ "${MUTATION_STARTED}" = "true" ]; then
            superseded=true
            alert=true
            echo "::warning::${GITHUB_SHA} is superseded (${GITHUB_REF_NAME} is now ${head_sha}), but this run had already begun changing production. Alerting."
          else
            superseded=true
            alert=false
            echo "::notice::${GITHUB_SHA} is no longer the tip of ${GITHUB_REF_NAME} (now ${head_sha}) and nothing was changed; not alerting."
          fi
          {
            echo "superseded=${superseded}"
            echo "alert=${alert}"
          } >> "${GITHUB_OUTPUT}"

      - name: Compose failure report
        if: steps.tip.outputs.alert == 'true'
        env:
          RESULT_TEST: ${{ needs.test.result }}
          RESULT_IMAGE: ${{ needs.image.result }}
          RESULT_DEPLOY: ${{ needs.deploy.result }}
          RESULT_FLY: ${{ needs.fly.result }}
          RESULT_SMOKE: ${{ needs.smoke.result }}
          RESULT_WATCH: ${{ needs.watch.result }}
          MUTATION_STARTED: ${{ needs.deploy.outputs.mutation_started }}
          SUPERSEDED: ${{ steps.tip.outputs.superseded }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p dist
          {
            echo "Deploy of \`${GITHUB_SHA}\` failed."
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Test (build.yml suite) | ${RESULT_TEST} |"
            echo "| Fly image (build + push) | ${RESULT_IMAGE} |"
            echo "| Deploy | ${RESULT_DEPLOY} |"
            echo "| Fly app (switch) | ${RESULT_FLY} |"
            echo "| Smoke (production specs) | ${RESULT_SMOKE} |"
            echo "| Watch (lost deployments) | ${RESULT_WATCH} |"
            echo
            echo "Run: ${RUN_URL}"
            echo
            if [ "${SUPERSEDED}" = "true" ]; then
              echo "> This run's commit is no longer the tip of \`main\`, but it had already"
              echo "> begun changing production when it failed, so the newer run behind it"
              echo "> cannot be assumed to have cleaned up after it."
              echo
            fi
            if [ "${MUTATION_STARTED}" != "true" ]; then
              echo "**Production was not touched.** The run failed before the deploy job's first"
              echo "remote change, which is the gate working. Fix forward on \`main\`."
            else
              echo "**Production may be partially updated.** The deploy job mutates production"
              echo "in sequence with no atomicity: \`cdk deploy\` → the Fly app's switch."
              echo "Whichever step failed, everything before it already landed. Read"
              echo "the run log to find how far it got. A failed switch leaves the previous image"
              echo "serving; \`fly/deploy.sh switch\` retries it by hand from this commit."
              echo
              echo "There is no automatic rollback: recover by fixing forward, or by switching"
              echo "the Fly app back to an earlier image (docs/runbook/deploys.md)."
            fi
            echo
            echo "Runbook: [docs/runbook/deploys.md](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/docs/runbook/deploys.md)"
          } > dist/deploy-failure.md

      - name: Find existing failure issue
        id: find-issue
        if: steps.tip.outputs.alert == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // listForRepo returns pull requests as well as issues, and a PR
            // carrying this label would otherwise be "updated" — i.e. have its
            // title and body overwritten with a deploy failure report.
            const items = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'deploy-failed',
              per_page: 100,
            });
            const issue = items.find((item) => !item.pull_request);
            core.setOutput('issue-number', issue?.number ?? '');

      - name: Open or update failure issue
        if: steps.tip.outputs.alert == 'true'
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: "Deploy to production failed (run ${{ github.run_id }})"
          content-filepath: ./dist/deploy-failure.md
          labels: deploy-failed
          issue-number: ${{ steps.find-issue.outputs.issue-number }}

  # Close the loop, so an open `deploy-failed` issue always means "production is
  # still broken" rather than "something broke here once".
  resolve:
    name: Resolve failure issue
    needs: [test, image, deploy, fly, smoke, watch]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const items = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'deploy-failed',
              per_page: 100,
            });
            // Never close a pull request that happens to carry the label.
            const issues = items.filter((item) => !item.pull_request);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            for (const issue of issues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Deploy of ${context.sha} succeeded and passed smoke: ${runUrl}. Closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
