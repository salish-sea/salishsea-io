name: Ingest Heartbeat

# External observer for the 5-minute pg_cron → Edge Function ingest
# (salish-89d.4 / decision 012). pg_cron can't watch itself die — the
# 2026-07-06 pg_net gap failed prod ingest silently — so this runs OUTSIDE the
# database: a scheduled check of ingest.runs that files a GitHub issue when no
# successful run is fresh enough, a run is stuck mid-flight, or successful runs
# had a hole in them within the last day. GitHub's cron is best-effort — far
# more so than "a little late": measured over 2026-08-23 → 09-10, checks were a
# median 68 minutes apart and up to 12.5 hours, against the 30 requested. That
# is why the third check exists: freshness is measured against the DB clock,
# so lateness cannot make a live outage look healthy, but a transient outage
# that healed between two checks was invisible to it (salish-oyf). The gap
# check reads the worst interval between successes over a window longer than
# the longest observed silence, so what it sees does not depend on when it runs.

on:
    schedule:
        - cron: '*/30 * * * *'
    workflow_dispatch:

concurrency:
    group: ingest-heartbeat
    cancel-in-progress: false

jobs:
    check:
        runs-on: ubuntu-latest
        environment: production
        permissions:
            contents: read
            issues: write  # failure issue, dwca-nightly pattern
        env:
            FRESHNESS_MINUTES: '30'  # ingest cron fires every 5 min → 6 misses
            STUCK_MINUTES: '15'      # Edge Function wall clock is minutes at most

        steps:
            - name: Checkout repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - name: Setup Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: package.json
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # Pre-seed the failure-issue body so content-filepath always exists even
            # when the job dies before heartbeat.ts runs (DSN/secret issue, install error,
            # DB unreachable). heartbeat.ts overwrites it with real findings on trip.
            # Same pattern and rationale as dwca-nightly.yml.
            - name: Seed default failure-issue body
              run: |
                  mkdir -p dist/ingest
                  cat > dist/ingest/heartbeat-report.txt <<EOF
                  Heartbeat workflow failed before scripts/ingest/heartbeat.ts could evaluate.

                  Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  Triggered: ${{ github.event_name }} on ${{ github.sha }} at $(date -u +'%Y-%m-%dT%H:%M:%SZ')

                  Check the failing step's logs. Common causes: DSN/secret issue, a
                  dependency install error, or the database being unreachable — the last of which
                  is itself an ingest outage, so treat this issue as a real alert.
                  EOF

            # Same DSN assembly as dwca-nightly.yml (see the rationale there): URL-encode
            # the password, mask it, connect via the IPv4 session pooler on port 5432.
            - name: Prepare Postgres DSN
              env:
                  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
                  SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
              run: |
                  ENCODED_PW=$(node -e 'process.stdout.write(encodeURIComponent(process.env.DB_PASSWORD))')
                  echo "::add-mask::${ENCODED_PW}"
                  printf 'SUPABASE_DB_URL=postgres://postgres.%s:%s@aws-1-us-west-1.pooler.supabase.com:5432/postgres\n' \
                    "${SUPABASE_PROJECT_ID}" "${ENCODED_PW}" >> "${GITHUB_ENV}"

            - name: Check ingest heartbeat
              run: pnpm exec tsx scripts/ingest/heartbeat.ts

            # Close the loop, as deploy.yml does: an open issue means the last check
            # tripped, not that something tripped once. A healed gap keeps tripping
            # until it is older than the lookback, so the issue stays open for as
            # long as the outage is recent, then closes itself — rather than sitting
            # open for weeks and suppressing the next alert, which is what happened
            # to #378.
            - name: Resolve failure issue
              if: success()
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              with:
                  script: |
                      const items = await github.paginate(github.rest.issues.listForRepo, {
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        state: 'open',
                        labels: 'ingest-heartbeat-failed',
                        per_page: 100,
                      });
                      // Never close a pull request that happens to carry the label.
                      const issues = items.filter((item) => !item.pull_request);
                      const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
                      for (const issue of issues) {
                        await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: issue.number,
                          body: `Heartbeat passed: every source fresh, nothing stuck, no gap in the lookback window. ${runUrl}. Closing.`,
                        });
                        await github.rest.issues.update({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: issue.number,
                          state: 'closed',
                        });
                      }

            - name: Find existing failure issue
              id: find-issue
              if: failure()
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              with:
                  script: |
                      // listForRepo returns pull requests as well as issues, and a PR
                      // carrying this label would otherwise be "updated" — i.e. have its
                      // title and body overwritten with this report. Same guard, and same
                      // reason, as deploy.yml's.
                      const items = await github.paginate(github.rest.issues.listForRepo, {
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        state: 'open',
                        labels: 'ingest-heartbeat-failed',
                        per_page: 100,
                      });
                      const issue = items.find((item) => !item.pull_request);
                      core.setOutput('issue-number', issue?.number ?? '');

            - name: Open or update failure issue
              if: failure()
              uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
              with:
                  title: "Ingest heartbeat failed (run ${{ github.run_id }})"
                  content-filepath: ./dist/ingest/heartbeat-report.txt
                  labels: ingest-heartbeat-failed
                  issue-number: ${{ steps.find-issue.outputs.issue-number }}
