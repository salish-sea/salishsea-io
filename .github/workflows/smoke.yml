name: Smoke Test

# Called by Deploy as its post-deploy gate, so a production that doesn't answer
# correctly turns the deploy run itself red and files an issue.
#
# This used to trigger on `workflow_run: [Deploy] completed` with an
# `if: conclusion == 'success'`, which meant a *failed* deploy — exactly when
# production is most likely to be half-updated — produced a skipped smoke run and
# no signal at all. `workflow_call` also checks out the commit being deployed
# rather than whatever the default branch happened to be by then.
on:
  workflow_call:
  schedule:
    - cron: '0 14 * * *'  # daily at 14:00 UTC (6am PT)
  workflow_dispatch:  # allow manual runs (e.g. to validate after changes)

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Run in Playwright's official image: browsers and system deps are pre-baked,
    # so there is no `playwright install` step to download/extract (it hangs
    # reproducibly at 100% for some Chrome builds). Keep this tag in sync with the
    # @playwright/test version in package.json -- browser builds are version-locked.
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Before setup-node, which needs pnpm on PATH to locate the store for
      # `cache: pnpm`. The version comes from package.json's `packageManager`.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run smoke test
        timeout-minutes: 4
        run: pnpm exec playwright test
        env:
          # Public production URL. Set as a literal rather than reading
          # vars.VITE_BASE_URL, which would require binding the job to the
          # `production` environment and record a spurious deployment per run.
          BASE_URL: https://salishsea.io

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-screenshot
          path: e2e/screenshots/
