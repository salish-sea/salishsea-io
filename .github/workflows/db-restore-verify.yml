name: Database Restore Verify

# A backup nobody has restored is a hope, not a backup (salish-5xy, decision 038).
#
# The nightly run checks that a dump carries the right rows. This checks the
# other half — that the file actually loads — by restoring the most recent
# backup into a throwaway Postgres and counting what arrives.
#
# WHAT THIS PROVES, AND WHAT IT DOES NOT. It proves the dump is loadable and
# complete: roles create, the schema builds, the data copies in, and the tables
# that matter hold the same number of rows they held in production. It does not
# reconstitute a Supabase project — GoTrue, Storage, PostgREST and the platform's
# own configuration are not exercised here, and a real recovery would restore
# into a new Supabase project rather than a bare container. The manual restore
# steps for that path are in the 2026-08-30 backup's README; this job is the
# automated floor beneath them.
#
# Manual by design. Restoring 166 MB nightly to assert something that changes
# only when the schema changes is not worth the minutes; run it after a
# migration that alters the shape of the database, or whenever you want to be
# able to say out loud that the backups load.
on:
    workflow_dispatch:
        inputs:
            key_prefix:
                description: 'Backup to restore, as db/YYYY/MM/DD/HHMMSS. Default: the most recent complete one.'
                required: false
                type: string

concurrency:
    group: db-restore-verify
    cancel-in-progress: false

jobs:
    restore:
        runs-on: ubuntu-latest
        environment: production
        # `shell: bash` is `bash -eo pipefail`, where the bare default is only
        # `bash -e`. Without pipefail a step like `verify-dump.ts | tee report`
        # exits with tee's status, so a dump that failed verification would have
        # been uploaded anyway — the check would run, print its complaint, and
        # change nothing.
        defaults:
            run:
                shell: bash
        permissions:
            id-token: write
            contents: read
        env:
            # Also declared in infra/lib/infra-stack.ts as BACKUP_BUCKET_NAME.
            BACKUP_BUCKET: salishsea-io-backups
            PGHOST: localhost
            PGPORT: '5432'
            # supabase_admin, not postgres: only it is a superuser in this image,
            # and the restore has to create roles and drop the platform's own
            # auth/storage schemas. Same password as postgres in this image.
            PGUSER: supabase_admin
            PGPASSWORD: postgres
            PGDATABASE: postgres

        services:
            # Supabase's own image, not stock Postgres: the schema dump creates
            # extensions (postgis, pg_cron, pg_net, supabase_vault) and grants to
            # platform roles that a vanilla server does not have, so a restore
            # there would fail for reasons that say nothing about the backup.
            postgres:
                image: public.ecr.aws/supabase/postgres:17.6.1.005
                env:
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 12

        steps:
            - name: Checkout repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

            - name: Setup Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: package.json
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
              with:
                  role-to-assume: arn:aws:iam::648183724555:role/salishsea-deploy-action
                  aws-region: us-west-2

            - name: Choose a backup
              id: choose
              env:
                  REQUESTED: ${{ inputs.key_prefix }}
              run: |
                  if [ -n "${REQUESTED}" ]; then
                      PREFIX="${REQUESTED}"
                  else
                      # Only prefixes holding a SHA256SUMS, which the backup job
                      # uploads last: a run that died partway leaves its files
                      # behind, and picking that one would fail the restore for a
                      # reason that has nothing to do with whether backups work.
                      # Keys are db/YYYY/MM/DD/HHMMSS/..., so lexical order is
                      # chronological.
                      #
                      # Then, newest first, the first one that also carries
                      # auth-storage.sql.gz. Backups taken before that artifact
                      # existed are complete by their own lights and cannot be
                      # restored by this workflow; skipping them beats failing in
                      # gunzip with a message about a missing file.
                      CANDIDATES=$(aws s3 ls "s3://${BACKUP_BUCKET}/db/" --recursive \
                        | awk '{print $4}' | grep '/SHA256SUMS$' \
                        | sed 's|/SHA256SUMS$||' | sort -r)
                      # A here-string and `read`, not `for X in ${LIST}`: the
                      # latter depends on word splitting, so it reads as one
                      # iteration or four depending on the shell.
                      while IFS= read -r CANDIDATE; do
                          [ -n "${CANDIDATE}" ] || continue
                          if aws s3 cp "s3://${BACKUP_BUCKET}/${CANDIDATE}/SHA256SUMS" - 2>/dev/null \
                             | grep -q 'auth-storage\.sql\.gz'; then
                              PREFIX="${CANDIDATE}"
                              break
                          fi
                          echo "Skipping ${CANDIDATE}: predates auth-storage.sql.gz."
                      done <<< "${CANDIDATES}"
                  fi
                  if [ -z "${PREFIX}" ]; then
                      echo "No backup under s3://${BACKUP_BUCKET}/db/ carries auth-storage.sql.gz, so none can be restored by this workflow. Run the nightly backup first." >&2
                      exit 1
                  fi
                  echo "prefix=${PREFIX}" >> "$GITHUB_OUTPUT"
                  echo "Restoring ${PREFIX}"

            # PREFIX comes through env, never interpolated into the script: it
            # originates in a workflow_dispatch input, and `${{ }}` splices its
            # value into the shell source before bash ever sees it.
            - name: Download and check integrity
              working-directory: /tmp
              env:
                  PREFIX: ${{ steps.choose.outputs.prefix }}
              run: |
                  aws s3 cp "s3://${BACKUP_BUCKET}/${PREFIX}/" . --recursive
                  # Before anything is trusted enough to load: the checksums the
                  # backup job recorded at the moment of writing.
                  sha256sum -c SHA256SUMS
                  gunzip -f roles.sql.gz schema.sql.gz auth-storage.sql.gz data.sql.gz

            # Restore order matters and is the same as the manual procedure:
            # roles exist before the schema grants to them, and the schema exists
            # before the data lands in it.
            #
            # ON_ERROR_STOP is off for roles only: the image already has the
            # platform roles, so re-creating them errors harmlessly. Schema and
            # data are strict — an error there is the failure this job exists to
            # catch.
            # A note on the shape of what follows, because it is not obvious.
            #
            # `auth` and `storage` are restored, then `public`, then `auth` and
            # `storage` AGAIN. The dependency is genuinely circular: public
            # tables carry foreign keys into auth.users, and auth's triggers call
            # functions that live in public. One pass in either order fails. The
            # first pass creates the tables, the second picks up the triggers it
            # could not create the first time.
            #
            # Every step that must tolerate an error tolerates exactly one kind —
            # something that already exists — and fails on anything else. That is
            # what keeps "restore the backup" from quietly meaning "run it and
            # see". The data load, which is the thing being proved, is strict.
            - name: Restore roles
              working-directory: /tmp
              run: |
                  # No `|| true`: with ON_ERROR_STOP=0 psql exits 0 for SQL errors
                  # (which the check below judges) and non-zero only for the ones
                  # no grep would find — a server it cannot reach, a file it
                  # cannot read. Those should fail here.
                  psql -v ON_ERROR_STOP=0 -f roles.sql > roles.log 2>&1
                  tail -20 roles.log
                  "${GITHUB_WORKSPACE}/scripts/only-already-exists.sh" roles.log 'roles.sql'

            - name: Restore auth and storage, first pass
              working-directory: /tmp
              run: |
                  # The image ships its own auth and storage at whatever version
                  # its baseline was cut — that is how the very first run of this
                  # workflow failed, on a column production has and the image did
                  # not. Dropping them makes this a test of the backup rather than
                  # of the image.
                  psql -v ON_ERROR_STOP=1 -c 'DROP SCHEMA IF EXISTS auth CASCADE; DROP SCHEMA IF EXISTS storage CASCADE;'
                  psql -v ON_ERROR_STOP=0 -f auth-storage.sql > auth1.log 2>&1
                  "${GITHUB_WORKSPACE}/scripts/only-already-exists.sh" auth1.log 'auth-storage.sql (first pass)' \
                      'does not exist'

            - name: Restore schema
              working-directory: /tmp
              run: psql -v ON_ERROR_STOP=1 -f schema.sql > /dev/null

            - name: Restore auth and storage, second pass
              working-directory: /tmp
              run: |
                  psql -v ON_ERROR_STOP=0 -f auth-storage.sql > auth2.log 2>&1
                  # Now that public exists, nothing may fail except re-creating
                  # what the first pass already made.
                  "${GITHUB_WORKSPACE}/scripts/only-already-exists.sh" auth2.log 'auth-storage.sql (second pass)'

            # No --disable-triggers needed: the CLI's data dump opens with
            # `SET session_replication_role = replica;` itself (verified against a
            # real dump), so foreign keys do not fight the load order.
            - name: Restore data
              working-directory: /tmp
              run: psql -v ON_ERROR_STOP=1 -f data.sql > /dev/null

            # The same comparison the nightly makes against production, made here
            # against the restored copy: the dump says N rows, the restored
            # database must hold N rows.
            - name: Verify the restored database matches the dump
              env:
                  SUPABASE_DB_URL: postgres://supabase_admin:postgres@localhost:5432/postgres
              working-directory: /tmp
              run: pnpm --dir "${GITHUB_WORKSPACE}" exec tsx "${GITHUB_WORKSPACE}/scripts/backup/verify-dump.ts" data.sql

            - name: Summarise
              env:
                  PREFIX: ${{ steps.choose.outputs.prefix }}
              run: |
                  {
                    echo "### Restore verified"
                    echo
                    echo "Backup: \`${PREFIX}\`"
                    echo
                    echo "Roles, schema and data loaded into \`supabase/postgres:17.6.1.005\`, and every"
                    echo "irreplaceable table holds the row count the dump recorded."
                  } >> "$GITHUB_STEP_SUMMARY"
