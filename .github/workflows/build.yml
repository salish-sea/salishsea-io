name: Build

# The full verification suite: type drift, build, unit tests, infra tests.
#
# Runs on every PR, and — via `workflow_call` — as the gate the Deploy workflow
# must pass before it touches production. PR checks run against the PR *head*,
# not the merge result, and nothing requires them anyway, so this being the same
# workflow in both places is the point: whatever reaches `main`, by whatever
# route, is verified by this exact suite before it ships.
on:
  pull_request:
    branches:
      - main
  workflow_call:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Both `db start` and `gen types` pull Supabase docker images; ghcr.io
      # avoids public.ecr.aws's 1-pull/sec anonymous rate limit. This used to
      # arrive as a setup-cli side effect (supabase/cli#5785).
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Before setup-node, which needs pnpm on PATH to locate the store for
      # `cache: pnpm`. The version comes from package.json's `packageManager`.
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The CLI is the `supabase` devDependency, so the database is started by
      # the exact version that generates types below, traceable to package.json.
      - run: pnpm exec supabase db start
      - name: Apply CI seed fixture
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/ci-seed.sql
      - name: Verify generated types match Postgres schema
        run: |
          pnpm run gen-types
          if ! git diff --ignore-space-at-eol --exit-code --quiet database.types.ts; then
            echo "Detected uncommitted changes after build. See status below:"
            git diff
            exit 1
          fi

      - run: pnpm run build
      - name: Run tests
        run: pnpm test
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      # `infra/` is a separate pnpm project with its own lockfile, so it needs
      # its own install — the root one does not reach it.
      - name: Install infra dependencies
        run: pnpm install --frozen-lockfile
        working-directory: infra

      - name: Run infra tests
        run: pnpm test
        working-directory: infra
