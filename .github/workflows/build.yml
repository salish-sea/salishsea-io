name: Build

# The full verification suite: type drift, build, unit tests, infra tests.
#
# Runs on every PR, and — via `workflow_call` — as the gate the Deploy workflow
# must pass before it touches production. PR checks run against the PR *head*,
# not the merge result, and nothing requires them anyway, so this being the same
# workflow in both places is the point: whatever reaches `main`, by whatever
# route, is verified by this exact suite before it ships.
on:
  pull_request:
    branches:
      - main
  workflow_call:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Before setup-node, which needs pnpm on PATH to locate the store for
      # `cache: pnpm`. The version comes from package.json's `packageManager`.
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - run: pnpm run build
      # No database: the derivations are checked against saved answers (salish-9uu.11).
      - name: Run tests
        run: pnpm test
      # The read-path graphs (stelis/, decision 092) and their tests run inside the Stelis
      # image this repo pins, which carries Racket, the engine as the `stelis` collection
      # and nothing else: the structural tests run in full; the one that needs the DuckDB
      # CLI and the esbuild comparison skip here and run in the Fly image build, which has
      # both. SALISHSEA_DIR points the graph at this checkout.
      - name: Test the read-path graphs in the pinned Stelis image
        run: |
          docker run --rm --user 1000:1000 -e HOME=/tmp -e SALISHSEA_DIR=/app -v "$PWD:/app" -w /app \
            --entrypoint raco "ghcr.io/rainhead/stelis@$(cat fly/stelis-digest)" \
            test stelis/salishsea-test.rkt stelis/salishsea-checkout-test.rkt stelis/salishsea-keys-test.rkt stelis/ts-imports-test.rkt

      # `infra/` is a separate pnpm project with its own lockfile, so it needs
      # its own install — the root one does not reach it.
      - name: Install infra dependencies
        run: pnpm install --frozen-lockfile
        working-directory: infra

      - name: Run infra tests
        run: pnpm test
        working-directory: infra
