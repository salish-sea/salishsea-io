# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Minimal configuration for getting started
language: "en-US"
reviews:
  profile: "chill"
  high_level_summary: true
  auto_review:
    enabled: true
    drafts: false
    # Peter's own branches are reviewed with the CodeRabbit CLI before the pull
    # request is opened, so the PR bot skips his PRs. Everyone else's it still reviews.
    ignore_usernames: ["rainhead"]
  review_status: false
